apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: inventory
          image: otel-from-zero-inventory:latest
          imagePullPolicy: Never
          command: ["flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "8082"]
          env:
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http,database
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector:
    app: inventory
  ports:
    - port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: orders
          image: otel-from-zero-orders:latest
          imagePullPolicy: Never
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: INVENTORY_URL
              value: http://inventory:8082
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
        - name: storefront
          image: otel-from-zero-storefront:latest
          imagePullPolicy: Never
          command: ["node", "server.js"]
          env:
            - name: ORDERS_URL
              value: http://orders:8081
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront
  ports:
    - port: 8080
