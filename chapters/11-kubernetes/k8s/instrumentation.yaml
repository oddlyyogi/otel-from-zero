apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: shop
spec:
  env:
    - name: NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  exporter:
    endpoint: http://$(NODE_IP):4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on
  nodejs:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
