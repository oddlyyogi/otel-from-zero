apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: '$${__value.raw}'
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090